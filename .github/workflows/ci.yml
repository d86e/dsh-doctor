name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-and-build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm run build
      - name: Verify bundle manifest is valid JSON
        run: node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch){process.exit(1)}; console.log('bundle manifest ok')"
      - name: Verify cordis.patch.yml parses
        run: node -e "const fs=require('fs'); const yaml=fs.readFileSync('./cordis.patch.yml','utf8'); if(!yaml.includes('- insert:')){process.exit(1)}; console.log('patch yml ok')"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib/

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (so tests can import lib if needed)
        run: pnpm run build
      - name: Run vitest
        run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: [typecheck-and-build, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack
        run: pnpm pack
      - name: Inspect pack contents
        run: pnpm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: "*.tgz"
